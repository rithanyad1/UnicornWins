[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Safety-first infrastructure monitoring backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "openai>=1.55,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]